services:
  reserva-salas:
    build: .
    image: reserva-salas-main
    container_name: reserva-salas-main
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - reserva-salas-data:/app/data

volumes:
  reserva-salas-data:
    name: reserva-salas-main-data
